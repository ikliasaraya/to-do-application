<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do Application</title>
    <link rel="stylesheet" href="/main.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div id="main-container" class="main-container container d-flex flex-column">
        <div id="header-container" class="header-container container d-flex flex-column">
            <h2 class="h2 text-center">Görev Ekleyin</h2>
            <div class="input-group mb-3">
                <button class="btn btn-outline-primary" type="button" id="button-add">Ekle</button>
                <input type="text" class="get-task form-control" placeholder="Bir görev ekleyin." aria-label="Example text with button addon" aria-describedby="button-add">
            </div>
            <button class="btn btn-outline-danger align-self-center text-nowrap overflow-hidden" type="button" id="button-clear-list">Listeyi Sıfırla</button>

        </div>
        <div id="search-container" class="search-container container d-flex flex-column">
            <div class="input-group mb-3">
                <button class="btn btn-outline-warning" type="button" id="button-search">Ara</button>
                <input type="text" class="form-control" placeholder="Bir görev arayın." aria-label="Example text with button addon" aria-describedby="button-search">
            </div>
        </div>
        <div id="list-container" class="list-container container d-flex flex-column">
            <h2 class="h2 text-center">Görev Listesi</h2>
            <div class="input-group mb-3">
                <button class="button-delete btn btn-outline-danger" type="button" id="button-delete"><i class="fa-solid fa-trash"></i></button>
                <input type="text" class="form-control" placeholder="" aria-label="Example text with button addon" aria-describedby="button-delete" readonly>
                <button class="button-check btn btn-outline-success" type="button" id="button-check"><i class="fa-solid fa-check"></i></button>
            </div>
            <div class="input-group mb-3">
                <button class="button-delete btn btn-outline-danger" type="button" id="button-delete"><i class="fa-solid fa-trash"></i></button>
                <input type="text" class="form-control" placeholder="" aria-label="Example text with button addon" aria-describedby="button-delete" readonly>
                <button class="button-check btn btn-outline-success" type="button" id="button-check"><i class="fa-solid fa-check"></i></button>
            </div>
            <div class="input-group mb-3">
                <button class="button-delete btn btn-outline-danger" type="button" id="button-delete"><i class="fa-solid fa-trash"></i></button>
                <input type="text" class="form-control" placeholder="" aria-label="Example text with button addon" aria-describedby="button-delete" readonly>
                <button class="button-check btn btn-outline-success" type="button" id="button-check"><i class="fa-solid fa-check"></i></button>
            </div>

        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js" integrity="sha384-fbbOQedDUMZZ5KreZpsbe1LCZPVmfTnH7ois6mU1QK+m14rQ1l2bGBq41eYeM/fS" crossorigin="anonymous"></script>
    <script src="/app.js"></script>
</body>
</html>
